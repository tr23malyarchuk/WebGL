<!doctype html>
<html>
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />

    <title>PA#2</title>
    <style>
      body {
        background-color: #eeeeee;
      }
    </style>

    <script src="./Utils/trackball-rotator.js"></script>
    <script src="./Utils/m4.js"></script>
    <script src="./shader.gpu"></script>
    <script src="./model.js"></script>
    <script src="./main.js"></script>
  </head>
  <body onload="init()">
    <h2>Conical Surface With Directrix Curve On Sphere</h2>

    <p id="message">
      Drag your mouse on the surface to rotate it.<br />
      (On a touch screen, you can use your finger.)
    </p>

    <div>
      U:
      <input
        type="range"
        id="uSlider"
        min="10"
        max="100"
        value="60"
        oninput="updateSurface()"
      />
      V:
      <input
        type="range"
        id="vSlider"
        min="5"
        max="50"
        value="20"
        oninput="updateSurface()"
      />
    </div>

    <div id="canvas-holder">
      <canvas
        width="1280"
        height="720"
        id="webglcanvas"
        style="background-color: red"
      ></canvas>
    </div>
  </body>
</html>
